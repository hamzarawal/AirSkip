name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      AIRSKIP_SIGN_IDENTITY: '-'
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-cache
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check build scripts
        run: bash -n scripts/build.sh scripts/sign-app.sh
      - name: Run regression checks
        run: swift test
      - name: Build and verify app bundle
        run: bash scripts/build.sh
